name: CI
on:
  push:
    branches: [main, staging, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fork-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make lint
      - run: make test
  runtime-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify pinned source
        run: make sync && make apply-patches
      - name: Build host Runtime
        run: make build
      - name: Verify generated app-server schema
        run: |
          make generate
          git diff --exit-code -- .yijie/schemas/app-server
      - name: Run Runtime Baseline 0 compatibility checks
        run: make runtime-test
